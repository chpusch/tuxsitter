name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]   # creating a release on GitHub builds the .deb and attaches it

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        run: python3 -m unittest discover -s tests -t . -v

      - name: Check translations are up to date
        run: |
          python3 tools/update-po.py
          git diff --exit-code po/ || (echo "::error::Run tools/update-po.py and commit po/" && exit 1)

      - name: Build .deb
        run: ./tools/build-deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: tuxsitter-deb
          path: build/*.deb

      - name: Attach to GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.deb
